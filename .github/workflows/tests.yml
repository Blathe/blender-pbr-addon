name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y glslang-tools xvfb libgl1-mesa-dri
          pip install "bpy==4.5.*" numpy pytest moderngl
      - name: Run tests
        # Xvfb gives moderngl a software OpenGL context, so the shaders run
        # and are compared with the numpy versions (tests/test_gpu_parity.py).
        run: xvfb-run -a python -m pytest -q -rs tests
      - name: Build extension zip
        run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: pbr_texture_graph
          path: dist/*.zip
